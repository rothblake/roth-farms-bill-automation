<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization — Roth Farms Bill Automation</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.6; }
  h1 { font-size: 1.4rem; }
  label { font-weight: 600; display: block; margin-top: 18px; }
  textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, Consolas, monospace;
             font-size: 0.95rem; padding: 8px; }
  .ok { color: #1a7f37; } .err { color: #b00020; }
  .hint { color: #555; }
</style>
</head>
<body>
  <h1>QuickBooks authorization</h1>
  <div id="out"></div>
  <script>
    var q = new URLSearchParams(window.location.search);
    var code = q.get('code'), realmId = q.get('realmId'), state = q.get('state'), err = q.get('error');
    function box(label, val){
      return '<label>' + label + '</label><textarea readonly rows="3" onclick="this.select()">'
             + (val || '') + '</textarea>';
    }
    var out = document.getElementById('out'), html = '';
    if (err) {
      html = '<p class="err">Intuit returned an error: ' + err + '</p>';
    } else if (!code) {
      html = '<p class="err">No authorization code in the URL. Open this page by completing the '
           + 'Intuit sign-in launched from authorize.py.</p>';
    } else {
      html = '<p class="ok">Authorization received. Copy the full URL below and paste it back into '
           + 'the <strong>authorize.py</strong> terminal window.</p>'
           + box('Full URL (paste this into the terminal)', window.location.href)
           + '<p class="hint">Or copy the individual values if asked:</p>'
           + box('Authorization code', code)
           + box('Company ID (realmId)', realmId);
    }
    out.innerHTML = html;
  </script>
</body>
</html>
